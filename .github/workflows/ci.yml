name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  VITE_SERVER_URL: https://placeholder.invalid
  CORS_ORIGIN: https://placeholder.invalid
  COACH_ACCESS_KEY: ci-placeholder-access-key-0123456789abcdef

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bunx ultracite check
      - run: bun test
      - run: cargo test --manifest-path apps/web/src-tauri/Cargo.toml
      - run: bun run --cwd apps/web desktop:build
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: installer-windows
          path: |
            apps/web/src-tauri/target/release/bundle/msi/*.msi
            apps/web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: installer-macos
          path: apps/web/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  database:
    name: database (ubuntu-latest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ylc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ylc
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test
